# WebDAV vhost for the storage test backend. Basic auth (testuser/testpass) so
# the driver's credential path is exercised, matching the prior bytemark/webdav
# fixture. The htpasswd file is generated by the entrypoint.
<VirtualHost *:8080>
    DocumentRoot /data/webdav

    <Directory /data/webdav>
        Options Indexes
        AllowOverride None
        Dav On

        AuthType Basic
        AuthName "webdav"
        AuthUserFile /etc/apache2/webdav.htpasswd
        Require valid-user
    </Directory>

    DavLockDB /var/lib/dav/lockdb
</VirtualHost>
