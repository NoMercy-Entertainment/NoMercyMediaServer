# Samba config for the storage test backend. One share "share" -> /data/smb.
# Guest-accessible (like a typical NAS media share): SMBLibrary authenticates
# against guest/anonymous SMB cleanly (verified against a real TrueNAS), whereas
# its NTLM user-auth blob is rejected by Samba. Throwaway, localhost-only.
[global]
   workgroup = WORKGROUP
   # Listen on 1445, not 445. With Docker Desktop host networking the container
   # shares the host's loopback, and on Windows the OS SMB server (LanmanServer,
   # System/PID 4) permanently owns 127.0.0.1:445 — a client would hit Windows
   # SMB, never this Samba. 1445 is free, and SMBLibrary (NoMercy fork) connects
   # with an explicit port.
   smb ports = 1445
   server min protocol = SMB2
   server max protocol = SMB3
   security = user
   map to guest = Bad User
   guest account = root
   server role = standalone server
   restrict anonymous = 0
   null passwords = yes
   # Match a typical NAS media share (verified against TrueNAS): SMB signing OFF.
   # Stock Samba requires/desires signing on SMB2/3, and SMBLibrary's anonymous
   # session-setup fails when the server insists on it.
   server signing = no
   smb2 leases = no
   client signing = no
   # SMBLibrary's SPNEGO expects raw NTLM in the negotiate. Stock Samba advertises
   # Kerberos+NTLM via GSS-SPNEGO; restrict the offered mechanisms to NTLMSSP so
   # SMBLibrary's GSS exchange matches (this is what a NAS like TrueNAS exposes).
   server schannel = no
   raw NTLMv2 auth = yes
   ntlm auth = ntlmv1-permitted

[share]
   path = /data/smb
   browseable = yes
   read only = no
   guest ok = yes
   guest only = yes
   create mask = 0777
   directory mask = 0777
   force user = root
