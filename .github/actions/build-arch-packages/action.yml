name: 'Build Arch Packages'
description: 'Build Arch Linux packages with shared runtime'
inputs:
  version:
    description: 'Package version'
    required: true
  dotnet-version:
    description: '.NET version to use'
    required: false
    default: '10.0.x'
  app-repo-token:
    description: 'Token for accessing the private NoMercyApp repo'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Build shared runtime payload
      uses: ./.github/actions/build-linux-installer-payload
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
        app-repo-token: ${{ inputs.app-repo-token }}

    - name: Pull Arch build container
      shell: bash
      run: |
        docker pull archlinux:base-devel

    - name: Stage Arch package sources
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        PAYLOAD_PATH="./installer-payload"
        BUILD_DIR="arch-build"

        rm -rf "${BUILD_DIR}"
        mkdir -p "${BUILD_DIR}/payload" "${BUILD_DIR}/assets"

        # Stage the shared runtime payload
        cp -R "${PAYLOAD_PATH}/." "${BUILD_DIR}/payload/"
        chmod 755 "${BUILD_DIR}/payload/NoMercyMediaServer"
        chmod 755 "${BUILD_DIR}/payload/NoMercyApp"
        chmod 755 "${BUILD_DIR}/payload/NoMercyLauncher"
        chmod 755 "${BUILD_DIR}/payload/nomercy"

        # Stage desktop files + icon for PKGBUILD's package()
        for df in NoMercy-MediaServer.desktop NoMercy-MediaServer-Service.desktop NoMercy-App.desktop; do
          if [ -f "./assets/linux/${df}" ]; then
            cp "./assets/linux/${df}" "${BUILD_DIR}/assets/"
          fi
        done
        cp "./assets/icons/icon.png" "${BUILD_DIR}/assets/icon.png"

        # PKGBUILD packages the prebuilt payload — no compile step, package()
        # only. Body is written flush-left (no leading whitespace) since
        # makepkg is not tolerant of that, unlike the surrounding YAML block.
        cat > "${BUILD_DIR}/PKGBUILD" << PKGBUILD_EOF
# Maintainer: NoMercy Entertainment <support@nomercy.tv>
pkgname=nomercy
pkgver=${VERSION}
pkgrel=1
pkgdesc="NoMercy MediaServer - complete installation"
arch=('x86_64')
url="https://nomercy.tv"
license=('custom')
depends=('glibc')

package() {
  install -dm755 "\$pkgdir/opt/nomercy"
  cp -a "\$startdir/payload/." "\$pkgdir/opt/nomercy/"
  chmod 755 "\$pkgdir/opt/nomercy/NoMercyMediaServer"
  chmod 755 "\$pkgdir/opt/nomercy/NoMercyApp"
  chmod 755 "\$pkgdir/opt/nomercy/NoMercyLauncher"
  chmod 755 "\$pkgdir/opt/nomercy/nomercy"

  install -dm755 "\$pkgdir/usr/bin"
  ln -s /opt/nomercy/NoMercyMediaServer "\$pkgdir/usr/bin/nomercymediaserver"
  ln -s /opt/nomercy/NoMercyApp "\$pkgdir/usr/bin/nomercyapp"
  ln -s /opt/nomercy/NoMercyLauncher "\$pkgdir/usr/bin/nomercylauncher"
  ln -s /opt/nomercy/nomercy "\$pkgdir/usr/bin/nomercy"

  install -dm755 "\$pkgdir/usr/share/applications"
  for df in NoMercy-MediaServer.desktop NoMercy-MediaServer-Service.desktop NoMercy-App.desktop; do
    if [ -f "\$startdir/assets/\${df}" ]; then
      install -m644 "\$startdir/assets/\${df}" "\$pkgdir/usr/share/applications/"
    fi
  done

  install -dm755 "\$pkgdir/usr/share/icons/hicolor/scalable/apps"
  install -m644 "\$startdir/assets/icon.png" "\$pkgdir/usr/share/icons/hicolor/scalable/apps/NoMercy-MediaServer.png"

  install -dm755 "\$pkgdir/usr/share/licenses/nomercy"
  echo "Proprietary software. All rights reserved." > "\$pkgdir/usr/share/licenses/nomercy/LICENSE"
}
PKGBUILD_EOF

        echo "Staged PKGBUILD:"
        cat "${BUILD_DIR}/PKGBUILD"

    - name: Build Arch package with makepkg
      shell: bash
      run: |
        set -euo pipefail
        BUILD_DIR="$(pwd)/arch-build"
        OUT_DIR="$(pwd)/packages/arch/pool/x86_64"
        mkdir -p "${OUT_DIR}"

        # makepkg refuses to run as root and needs real Arch tooling
        # (fakeroot, bsdtar) to produce a correctly-ordered archive with a
        # valid .PKGINFO/.MTREE — that guarantee is why this runs makepkg
        # itself inside Arch rather than hand-assembling the tarball.
        docker run --rm -v "${BUILD_DIR}:/build" -w /build archlinux:base-devel bash -c '
          set -euo pipefail
          useradd -m builder
          chown -R builder:builder /build
          su builder -c "cd /build && makepkg -f --noconfirm"
        '

        pkg_file=$(ls "${BUILD_DIR}"/*.pkg.tar.zst | head -n1)
        cp "${pkg_file}" "${OUT_DIR}/"
        rm -rf "${BUILD_DIR}"
        echo "Successfully created nomercy Arch package: $(basename "${pkg_file}")"

    - name: Generate Arch repository database
      shell: bash
      run: |
        set -euo pipefail
        OUT_DIR="$(pwd)/packages/arch/pool/x86_64"

        if ! ls "${OUT_DIR}"/*.pkg.tar.zst >/dev/null 2>&1; then
          echo "ERROR: No package files found"
          exit 1
        fi

        # repo-add is the real Arch tool for sync-db generation — it produces
        # a valid nomercy.db.tar.gz (+ nomercy.db symlink) that pacman -Sy can
        # actually parse, unlike a hand-rolled text file.
        docker run --rm -v "${OUT_DIR}:/repo" -w /repo archlinux:base-devel bash -c '
          set -euo pipefail
          pacman -Sy --noconfirm --needed pacman-contrib
          useradd -m builder
          chown -R builder:builder /repo
          su builder -c "cd /repo && repo-add nomercy.db.tar.gz *.pkg.tar.zst"
        '

        echo "Created Arch repository:"
        ls -la "${OUT_DIR}"

    - name: Upload Arch artifacts
      uses: actions/upload-artifact@v7
      with:
        name: arch-packages
        path: packages/arch/
