name: 'Test Workflow'

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: '.NET version to use'
        required: false
        type: string
        default: '10.0.x'

jobs:
  # Fast tests that run on every push/PR
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Setup .NET Environment
        uses: ./.github/actions/setup-dotnet
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Run fast tests (Unit + ErrorHandling + Characterization)
        run: >
          dotnet test NoMercy.Server.sln
          --configuration Debug
          --no-restore
          --verbosity minimal
          --logger trx
          --blame-hang-timeout 5m
          --filter "(Category=Unit|Category=ErrorHandling|Category=Characterization)&Category!=Integration"

  # Full-suite coverage job — runs on master or manual dispatch (the release path).
  # MUST block: it is the only job that runs uncategorized tests (e.g. the plugin
  # suite, which carries no Category trait and is excluded from the fast `test`
  # filter). With continue-on-error a red full suite sailed straight to release.
  coverage:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Setup .NET Environment
        uses: ./.github/actions/setup-dotnet
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Run tests with coverage
        run: >
          dotnet test NoMercy.Server.sln 
          --configuration Release
          --collect:"XPlat Code Coverage"
          --settings tests/coverletArgs.runsettings
          --verbosity minimal

  # Integration tests - only runs on master, releases, or manually
  integration_tests:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Setup .NET Environment
        uses: ./.github/actions/setup-dotnet
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Fetch nomercy-ffmpeg fork (real-encode integration tests)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release list --repo NoMercy-Entertainment/nomercy-ffmpeg --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')"
          dest="$HOME/.local/share/NoMercy_dev/binaries/ffmpeg"
          mkdir -p "$dest"
          gh release download "$tag" --repo NoMercy-Entertainment/nomercy-ffmpeg --pattern 'ffmpeg-*-linux-x86_64-*.tar.gz' --dir /tmp/nmff --clobber
          tar -xzf /tmp/nmff/ffmpeg-*-linux-x86_64-*.tar.gz -C "$dest"
          chmod +x "$dest/ffmpeg" "$dest/ffprobe"
          echo "NOMERCY_FFMPEG_PATH=$dest/ffmpeg" >> "$GITHUB_ENV"
          echo "Fetched nomercy-ffmpeg $tag -> $dest"

      - name: Run integration tests
        run: >
          dotnet test NoMercy.Server.sln
          --configuration Debug
          --no-restore
          --verbosity minimal
          --logger trx
          --blame-hang-timeout 10m
          --filter "Category=Integration"

      - name: Run performance tests
        run: >
          dotnet test NoMercy.Server.sln 
          --configuration Release
          --no-restore
          --verbosity minimal
          --logger trx
          --blame-hang-timeout 15m
          --filter "Category=Performance"
